[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-as-judge"
version = "0.1.0"
description = "Fast, calibrated, token-free LLM & AI agent evaluation using Laya typed decision models instead of slow and expensive LLM-as-a-Judge"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Laya-as-Judge Contributors" }
]
keywords = [
    "llm-as-a-judge",
    "evaluation",
    "laya",
    "mlx",
    "decision-models",
    "guardrails",
    "rag-evaluation",
    "benchmarking",
    "ai-safety"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "numpy>=1.20.0",
    "rich>=12.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.16.0; sys_platform == 'darwin'",
    "laya-mlx>=0.2.0; sys_platform == 'darwin'",
]
torch = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
]
all = [
    "laya-as-judge[mlx,torch]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
laya-judge = "laya_as_judge.cli:main"

[project.urls]
Homepage = "https://github.com/rbrus/laya-as-judge"
Repository = "https://github.com/rbrus/laya-as-judge"
"Bug Tracker" = "https://github.com/rbrus/laya-as-judge/issues"
"Laya MLX Runtime" = "https://github.com/mizorewww/laya-mlx"

[tool.setuptools.packages.find]
where = ["."]
include = ["laya_as_judge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
